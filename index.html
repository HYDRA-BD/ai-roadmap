<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f0f1a;color:#fff;min-height:100vh;overscroll-behavior:none}
#app{padding-bottom:80px;min-height:100vh}
.hdr{padding:16px;background:linear-gradient(135deg,#667eea,#764ba2);position:sticky;top:0;z-index:50}
.hdr h1{font-size:18px;font-weight:800}
.hdr .sub{font-size:11px;opacity:.9;margin-top:2px}
.signout-btn{position:absolute;right:12px;top:14px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:10px;padding:4px 10px;border-radius:20px;cursor:pointer}
.stats-row{display:flex;gap:6px;padding:10px 12px;overflow-x:auto}
.stat{flex:1;min-width:78px;background:rgba(255,255,255,.06);border-radius:10px;padding:8px;text-align:center}
.stat .v{font-size:16px;font-weight:800;background:linear-gradient(135deg,#f093fb,#f5576c);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat .l{font-size:9px;opacity:.7;margin-top:2px;text-transform:uppercase;letter-spacing:.4px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#161627;display:flex;border-top:1px solid rgba(255,255,255,.08);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:none;color:#888;padding:10px 4px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nav button.active{color:#fff}
.nav button .ic{font-size:18px}
.view{padding:12px}
.card{background:linear-gradient(135deg,var(--c1,#667eea),var(--c2,#764ba2));border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;transition:transform .12s}
.card:active{transform:scale(.985)}
.card h3{font-size:15px;font-weight:700;margin-bottom:3px}
.card .meta{font-size:10px;opacity:.85;margin-bottom:8px}
.bar{height:5px;background:rgba(0,0,0,.25);border-radius:3px;overflow:hidden;margin-top:6px}
.bar .fill{height:100%;background:rgba(255,255,255,.95);border-radius:3px;transition:width .35s}
.sub-card{background:#1a1a2e;border-radius:12px;padding:12px;margin-bottom:8px;border-left:3px solid var(--c1,#667eea)}
.sub-card.done{opacity:.7}
.sub-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sub-head h4{font-size:13px;font-weight:700;flex:1}
.sub-head .badge{font-size:9px;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.1);margin-left:6px}
.sub-card.done .badge{background:#10b981;color:#fff}
.sub-meta{font-size:10px;color:#888;margin-bottom:6px}
.sub-field{font-size:11px;line-height:1.5;margin:4px 0;color:#c5c5d8}
.sub-field b{color:#fff;font-weight:600}
.questions{background:rgba(251,191,36,.08);border-left:2px solid #fbbf24;padding:8px;border-radius:4px;margin-top:8px;font-size:10px;line-height:1.6;color:#fde68a}
.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}
.layer{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:6px;padding:6px 4px;text-align:center;font-size:9px;cursor:pointer;transition:all .1s;user-select:none}
.layer.on{background:linear-gradient(135deg,#10b981,#059669);border-color:#10b981;font-weight:600}
.layer .cb{font-size:12px;display:block}
.btn{background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:#fff;padding:10px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;width:100%;margin-top:6px}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}
input,textarea{width:100%;background:#1a1a2e;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:8px 10px;color:#fff;font-size:12px;font-family:inherit;margin-top:4px}
textarea{resize:vertical;min-height:70px;line-height:1.5}
label{font-size:10px;opacity:.7;text-transform:uppercase;letter-spacing:.4px;margin-top:8px;display:block}
.today{background:linear-gradient(135deg,#1a1a2e,#252545);border-radius:12px;padding:12px;margin-bottom:10px}
.today h3{font-size:13px;margin-bottom:8px;background:linear-gradient(135deg,#f093fb,#f5576c);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.entry{background:#1a1a2e;border-radius:8px;padding:10px;margin-bottom:6px;border-left:2px solid #f5576c}
.entry .d{font-size:9px;opacity:.6;margin-bottom:2px}
.entry h4{font-size:12px;margin-bottom:3px}
.entry p{font-size:11px;line-height:1.5;color:#c5c5d8;white-space:pre-wrap}
.back{background:none;border:none;color:#fff;font-size:12px;padding:6px 0;cursor:pointer;margin-bottom:6px}
.hero{border-radius:14px;padding:14px;margin-bottom:12px;background:linear-gradient(135deg,var(--c1),var(--c2))}
.hero h2{font-size:18px;margin-bottom:4px}
.hero .goal{font-size:11px;line-height:1.5;opacity:.95}
.hero .info{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.hero .info span{font-size:9px;background:rgba(0,0,0,.25);padding:3px 7px;border-radius:20px}
.hero .bar{background:rgba(0,0,0,.3);margin-top:8px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(60px);background:linear-gradient(135deg,#10b981,#059669);color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:600;z-index:999;opacity:0;transition:all .25s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.hint{color:#888;font-size:11px;text-align:center;padding:16px}
/* Auth screen */
.auth-screen{padding:40px 20px;max-width:420px;margin:0 auto}
.auth-screen h1{font-size:26px;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-screen .subtitle{color:#888;font-size:12px;margin-bottom:24px}
.auth-error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#fca5a5;padding:8px 12px;border-radius:8px;font-size:11px;margin-bottom:12px;line-height:1.5}
.auth-info{background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.4);color:#fde68a;padding:8px 12px;border-radius:8px;font-size:11px;margin-bottom:12px;line-height:1.5}
.auth-divider{text-align:center;color:#666;font-size:10px;margin:16px 0;position:relative}
.auth-divider::before,.auth-divider::after{content:"";position:absolute;top:50%;width:42%;height:1px;background:#333}
.auth-divider::before{left:0}
.auth-divider::after{right:0}
.auth-skip{background:transparent;border:none;color:#888;font-size:11px;padding:12px;cursor:pointer;width:100%;margin-top:12px}
.signed-in-bar{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:11px;color:#a7f3d0;display:flex;justify-content:space-between;align-items:center}

/* ============================================================
   LOCAL STORAGE
   ============================================================ */
const KEY="airoadmap_v1";
let S=load();

function load(){
  try { const r=localStorage.getItem(KEY); if(r) return JSON.parse(r); } catch(e){}
  return {subs:{}, logs:{}};
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ console.warn("localStorage save failed:", e); }
}
function sub(id){ if(!S.subs[id]) S.subs[id]={}; return S.subs[id]; }
function subDone(id){ const st=sub(id); let n=0; for(const L of LAYERS) if(st[L.k]) n++; return n; }
function subHours(id){ return subDone(id)/6*getSub(id).h; }
function getSub(id){ for(const lv of LEVELS) for(const s of lv.subs) if(s.id===id) return s; return null; }
function levelDone(lv){ let d=0,h=0; for(const s of lv.subs){ d+=subDone(s.id); h+=subHours(s.id); } return {done:d,total:lv.subs.length*6,hours:h}; }
function overall(){ let d=0,t=0,h=0; for(const lv of LEVELS) for(const s of lv.subs){ d+=subDone(s.id); t+=6; h+=subHours(s.id); } return {done:d,total:t,hours:h,pct:t?Math.round(d/t*100):0}; }
function totalHoursAll(){ let h=0; for(const lv of LEVELS) h+=lv.hours; return h; }
function currentLevel(){ for(const lv of LEVELS){ const p=levelDone(lv); if(p.done<p.total) return lv; } return LEVELS[11]; }
function xp(){
  let x=0;
  for(const lv of LEVELS) for(const s of lv.subs){ const d=subDone(s.id); x+=d*5; if(d===6) x+=50; }
  for(const d in S.logs){ const g=S.logs[d]; if(g.did||g.learned||g.blocked||g.next) x+=10; if(g.commit) x+=5; if(g.tweet) x+=5; }
  return x;
}
function streak(){
  const today=new Date(); let s=0;
  for(let i=0;i<3650;i++){
    const d=new Date(today); d.setDate(d.getDate()-i);
    const k=d.toISOString().slice(0,10);
    const g=S.logs[k];
    if(g&&(g.did||g.learned||g.blocked||g.next)) s++;
    else if(i>0) break;
  }
  return s;
}
function today(){ return new Date().toISOString().slice(0,10); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove("show"),1500); }

/* ============================================================
   SUPABASE SYNC
   ============================================================ */
async function syncFromCloud(){
  if(!currentUser || !supabase) return;
  try {
    const { data: layers, error: e1 } = await supabase.from('layers').select('*').eq('user_id', currentUser.id);
    const { data: logs, error: e2 } = await supabase.from('logs').select('*').eq('user_id', currentUser.id);
    if(e1 || e2){ console.warn("cloud fetch:", e1, e2); return; }
    
    const newS = {subs:{}, logs:{}};
    if(layers) for(const row of layers){
      if(!newS.subs[row.sub_id]) newS.subs[row.sub_id]={};
      newS.subs[row.sub_id][row.layer] = !!row.done;
    }
    if(logs) for(const row of logs){
      newS.logs[row.date] = {
        did: row.did||"", learned: row.learned||"",
        blocked: row.blocked||"", next: row.next||"",
        commit: !!row.commit, tweet: !!row.tweet
      };
    }
    S = newS;
    save();
  } catch(e){ console.warn("syncFromCloud:", e); }
}

async function pushLocalToCloud(){
  if(!currentUser || !supabase) return;
  try {
    const layerRows = [];
    for(const subId in S.subs){
      for(const layer in S.subs[subId]){
        layerRows.push({
          user_id: currentUser.id, sub_id: subId, layer,
          done: S.subs[subId][layer], updated_at: new Date().toISOString()
        });
      }
    }
    if(layerRows.length) await supabase.from('layers').upsert(layerRows);
    
    const logRows = [];
    for(const date in S.logs){
      const g = S.logs[date];
      logRows.push({
        user_id: currentUser.id, date,
        did: g.did, learned: g.learned, blocked: g.blocked, next: g.next,
        commit: g.commit, tweet: g.tweet, updated_at: new Date().toISOString()
      });
    }
    if(logRows.length) await supabase.from('logs').upsert(logRows);
  } catch(e){ console.warn("pushLocalToCloud:", e); }
}

async function syncLayerToCloud(subId, layer, done){
  if(!currentUser || !supabase) return;
  try {
    await supabase.from('layers').upsert({
      user_id: currentUser.id, sub_id: subId, layer, done,
      updated_at: new Date().toISOString()
    });
  } catch(e){ console.warn("layer sync:", e); }
}

async function syncLogToCloud(date, data){
  if(!currentUser || !supabase) return;
  try {
    await supabase.from('logs').upsert({
      user_id: currentUser.id, date,
      did: data.did, learned: data.learned, blocked: data.blocked, next: data.next,
      commit: data.commit, tweet: data.tweet,
      updated_at: new Date().toISOString()
    });
  } catch(e){ console.warn("log sync:", e); }
}

/* ============================================================
   AUTH
   ============================================================ */
function showAuth(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="auth-screen">
      <h1>🎯 AI Road Map</h1>
      <p class="subtitle">${authMode==="signin"?"Sign in to sync progress across devices":"Create an account to start syncing"}</p>
      ${authError?`<div class="auth-error">${authError}</div>`:""}
      ${authInfo?`<div class="auth-info">${authInfo}</div>`:""}
      ${!supabase?`<div class="auth-error">Supabase not configured. Add your URL and anon key in the source to enable cloud sync.</div>`:""}
      
      <label>Email</label>
      <input id="auth-email" type="email" placeholder="you@example.com" autocomplete="email">
      
      <label>Password</label>
      <input id="auth-password" type="password" placeholder="min 6 characters" autocomplete="current-password">
      
      <button class="btn" id="auth-submit">${authMode==="signin"?"Sign In":"Create Account"}</button>
      
      <div class="auth-divider">or</div>
      
      <button class="btn ghost" id="auth-toggle">${authMode==="signin"?"Create Account":"Sign In Instead"}</button>
      <button class="auth-skip" id="auth-offline">Continue without sync →</button>
      
      <p style="color:#666;font-size:10px;margin-top:24px;text-align:center;line-height:1.6">
        Free forever · Row-level security keeps your data private<br>
        Your progress is only visible to you
      </p>
    </div>
  `;
  
  document.getElementById("auth-submit").onclick = async () => {
    if(!supabase){ authError="Supabase not configured"; showAuth(); return; }
    authError=""; authInfo="";
    const email = document.getElementById("auth-email").value.trim();
    const password = document.getElementById("auth-password").value;
    if(!email || !password){ authError="Enter email and password"; showAuth(); return; }
    if(password.length<6){ authError="Password must be at least 6 characters"; showAuth(); return; }
    
    const btn = document.getElementById("auth-submit");
    btn.textContent = "Please wait..."; btn.disabled = true;
    
    try {
      if(authMode==="signin"){
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if(error){ authError=error.message; authInfo=""; showAuth(); return; }
      } else {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if(error){ authError=error.message; showAuth(); return; }
        if(data.user && !data.session){
          authInfo="Check your email for a confirmation link, then return here to sign in.";
          authMode="signin";
          showAuth();
          return;
        }
      }
      await afterAuth();
    } catch(e){
      authError = e.message || "Authentication failed. Check your connection.";
      showAuth();
    }
  };
  
  document.getElementById("auth-toggle").onclick = () => {
    authMode = authMode==="signin" ? "signup" : "signin";
    authError = ""; authInfo = "";
    showAuth();
  };
  
  document.getElementById("auth-offline").onclick = () => {
    currentUser = null;
    render();
  };
}

async function afterAuth(){
  try {
    const { data: { session } } = await supabase.auth.getSession();
    currentUser = session ? session.user : null;
    if(!currentUser){ showAuth(); return; }
    
    const { data: cloudLayers } = await supabase.from('layers').select('user_id').eq('user_id', currentUser.id).limit(1);
    const { data: cloudLogs } = await supabase.from('logs').select('user_id').eq('user_id', currentUser.id).limit(1);
    const cloudHasData = (cloudLayers && cloudLayers.length>0) || (cloudLogs && cloudLogs.length>0);
    
    if(cloudHasData){
      await syncFromCloud();
    } else {
      await pushLocalToCloud();
    }
    render();
  } catch(e){
    console.warn("afterAuth:", e);
    toast("Cloud sync failed — using local data");
    render();
  }
}

async function signOut(){
  if(!supabase) return;
  if(!confirm("Sign out? Your local data stays on this device.")) return;
  try { await supabase.auth.signOut(); } catch(e){}
  currentUser = null;
  authMode = "signin";
  authError = ""; authInfo = "";
  toast("Signed out");
  showAuth();
}

async function checkAuth(){
  if(!supabase){ render(); return; }
  try {
    const { data: { session } } = await supabase.auth.getSession();
    currentUser = session ? session.user : null;
    if(currentUser){
      await afterAuth();
    } else {
      showAuth();
    }
  } catch(e){
    console.warn("checkAuth:", e);
    render();
  }
}

let route={v:"home"};
function nav(v,arg){ route={v,arg}; render(); window.scrollTo(0,0); }

function render(){
  const app=document.getElementById("app");
  const L=currentLevel();
  const ov=overall();
  let h='<div class="hdr"><h1>🎯 AI Road Map</h1><div class="sub">Level '+L.n+' · '+ov.pct+'% · '+ov.hours.toFixed(0)+'/'+totalHoursAll()+' hrs</div>';
  if(currentUser) h+='<button class="signout-btn" onclick="signOut()">Sign out</button>';
  h+='</div>';
  
  h+='<div class="stats-row">';
  h+='<div class="stat"><div class="v">'+xp()+'</div><div class="l">XP</div></div>';
  h+='<div class="stat"><div class="v">'+streak()+'🔥</div><div class="l">Streak</div></div>';
  h+='<div class="stat"><div class="v">'+ov.pct+'%</div><div class="l">Done</div></div>';
  h+='<div class="stat"><div class="v">'+Object.keys(S.logs).length+'</div><div class="l">Logs</div></div>';
  h+='</div>';
  
  if(route.v==="home") h+=viewHome();
  else if(route.v==="levels") h+=viewLevels();
  else if(route.v==="level") h+=viewLevel(route.arg);
  else if(route.v==="sub") h+=viewSub(route.arg);
  else if(route.v==="log") h+=viewLog();
  else if(route.v==="stats") h+=viewStats();
  
  h+='<div class="nav">';
  h+='<button data-nav="home" class="'+(route.v==="home"?"active":"")+'"><span class="ic">🏠</span>Home</button>';
  h+='<button data-nav="levels" class="'+(route.v==="levels"||route.v==="level"||route.v==="sub"?"active":"")+'"><span class="ic">🎯</span>Levels</button>';
  h+='<button data-nav="log" class="'+(route.v==="log"?"active":"")+'"><span class="ic">📅</span>Log</button>';
  h+='<button data-nav="stats" class="'+(route.v==="stats"?"active":"")+'"><span class="ic">📊</span>Stats</button>';
  h+='</div>';
  
  app.innerHTML=h;
  attach();
}

function viewHome(){
  const L=currentLevel(),p=levelDone(L);
  let h='<div class="view">';
  h+='<h3 style="font-size:13px;margin-bottom:8px;color:#fff">⚡ Current Focus</h3>';
  h+='<div class="card" style="--c1:'+L.c[0]+';--c2:'+L.c[1]+'" onclick="nav(\'level\','+L.n+')"><h3>Level '+L.n+' — '+L.name+'</h3><div class="meta">'+L.skill+' · '+L.weeks+' weeks · '+L.hours+' hrs</div><div class="bar"><div class="fill" style="width:'+(p.done/p.total*100)+'%"></div></div><div style="font-size:10px;margin-top:5px;opacity:.9">'+p.hours.toFixed(0)+' / '+L.hours+' hrs</div></div>';
  
  h+='<h3 style="font-size:13px;margin:12px 0 8px;color:#fff">📖 Next Up</h3>';
  const next=L.subs.find(s=>subDone(s.id)<6);
  if(next){
    h+='<div class="sub-card" style="--c1:'+L.c[0]+'"><div class="sub-head"><h4>'+next.id+' — '+next.n+'</h4><span class="badge">'+subDone(next.id)+'/6</span></div><div class="sub-field"><b>Book:</b> '+next.b+'</div><div class="sub-field"><b>YouTube:</b> '+next.y+'</div><button class="btn" onclick="nav(\'sub\',\''+next.id+'\')">Open →</button></div>';
  } else {
    h+='<div class="hint">All current level sublevels done! Move to next level.</div>';
  }
  
  const recent=Object.keys(S.logs).sort().reverse().slice(0,3);
  if(recent.length){
    h+='<h3 style="font-size:13px;margin:12px 0 8px;color:#fff">🕘 Recent Logs</h3>';
    for(const d of recent){
      const g=S.logs[d];
      h+='<div class="entry"><div class="d">'+d+'</div><h4>'+(g.commit?"✅ ":"")+(g.tweet?"🐦 ":"")+(g.did||"(empty)")+'</h4>'+(g.learned?'<p>Learned: '+g.learned+'</p>':'')+'</div>';
    }
  }
  h+='</div>';
  return h;
}

function viewLevels(){
  let h='<div class="view"><h3 style="font-size:14px;margin-bottom:10px">All 12 Levels</h3>';
  for(const lv of LEVELS){
    const p=levelDone(lv); const pct=Math.round(p.done/p.total*100);
    h+='<div class="card" style="--c1:'+lv.c[0]+';--c2:'+lv.c[1]+'" onclick="nav(\'level\','+lv.n+')"><h3>Level '+lv.n+' — '+lv.name+'</h3><div class="meta">'+lv.subs.length+' sublevels · '+lv.hours+' hrs · '+pct+'%</div><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div></div>';
  }
  h+='</div>';
  return h;
}

function viewLevel(n){
  const lv=LEVELS.find(l=>l.n===+n); const p=levelDone(lv);
  let h='<div class="view">';
  h+='<button class="back" onclick="nav(\'levels\')">← All Levels</button>';
  h+='<div class="hero" style="--c1:'+lv.c[0]+';--c2:'+lv.c[1]+'"><h2>Level '+lv.n+' — '+lv.name+'</h2><div class="goal">'+lv.goal+'</div><div class="info"><span>🎯 '+lv.skill+'</span><span>⏱ '+lv.weeks+' wks</span><span>📦 '+lv.hours+' hrs</span></div><div class="bar"><div class="fill" style="width:'+(p.done/p.total*100)+'%"></div></div><div style="font-size:10px;margin-top:5px">'+p.hours.toFixed(0)+' / '+lv.hours+' hrs</div></div>';
  h+='<div style="background:rgba(251,191,36,.08);border-left:3px solid #fbbf24;border-radius:8px;padding:10px;margin-bottom:12px;font-size:11px"><b style="color:#fbbf24">🏆 Boss:</b> <span style="color:#c5c5d8">'+lv.boss+'</span></div>';
  for(const s of lv.subs){
    const d=subDone(s.id); const done=d===6;
    h+='<div class="sub-card '+(done?"done":"")+'" style="--c1:'+lv.c[0]+'" onclick="nav(\'sub\',\''+s.id+'\')"><div class="sub-head"><h4>'+s.id+' — '+s.n+'</h4><span class="badge">'+(done?"✓ Done":d+"/6")+'</span></div><div class="sub-meta">⏱ '+s.h+' hrs · '+subHours(s.id).toFixed(1)+' completed</div></div>';
  }
  h+='</div>';
  return h;
}

function viewSub(id){
  const s=getSub(id); let lv; for(const L of LEVELS) if(L.subs.includes(s)){ lv=L; break; }
  const st=sub(id); const d=subDone(id);
  let h='<div class="view">';
  h+='<button class="back" onclick="nav(\'level\','+lv.n+')">← Level '+lv.n+'</button>';
  h+='<div class="hero" style="--c1:'+lv.c[0]+';--c2:'+lv.c[1]+'"><h2>'+s.id+' — '+s.n+'</h2><div class="goal">'+s.o+'</div><div class="bar"><div class="fill" style="width:'+(d/6*100)+'%"></div></div><div style="font-size:10px;margin-top:5px">'+d+'/6 layers · '+s.h+' hrs total · '+subHours(id).toFixed(1)+' hrs done</div></div>';
  h+='<div class="sub-card" style="--c1:'+lv.c[0]+'"><div class="sub-field"><b>📖 Book:</b> '+s.b+'</div><div class="sub-field"><b>🎥 YouTube:</b> '+s.y+'</div><div class="questions"><b>💎 Crystal Clear Questions:</b><br>'+s.q.map(q=>'◆ '+q).join('<br>')+'</div></div>';
  h+='<h3 style="font-size:13px;margin:12px 0 8px;color:#fff">✅ Layers</h3>';
  h+='<div class="layers">';
  for(const L of LAYERS){
    h+='<div class="layer '+(st[L.k]?"on":"")+'" data-tog="'+id+'|'+L.k+'"><span class="cb">'+(st[L.k]?"☑":"☐")+'</span>'+L.ic+' '+L.n+'</div>';
  }
  h+='</div>';
  h+='</div>';
  return h;
}

function viewLog(){
  const d=today(); const g=S.logs[d]||{did:"",learned:"",blocked:"",next:"",commit:false,tweet:false};
  let h='<div class="view"><h3 style="font-size:14px;margin-bottom:8px">📅 '+d+'</h3>';
  h+='<div class="today"><label>Did</label><textarea id="f_did" placeholder="What did you do?">'+g.did+'</textarea><label>Learned</label><textarea id="f_learned" placeholder="What did you learn?">'+g.learned+'</textarea><label>Blocked</label><textarea id="f_blocked" placeholder="What blocked you?">'+g.blocked+'</textarea><label>Next</label><textarea id="f_next" placeholder="What is next?">'+g.next+'</textarea>';
  h+='<div style="display:flex;gap:8px;margin-top:10px"><label style="flex:1;display:flex;align-items:center;gap:5px;margin:0;text-transform:none;letter-spacing:0"><input type="checkbox" id="f_commit" '+(g.commit?"checked":"")+' style="width:auto"> 🐙 Commit</label><label style="flex:1;display:flex;align-items:center;gap:5px;margin:0;text-transform:none;letter-spacing:0"><input type="checkbox" id="f_tweet" '+(g.tweet?"checked":"")+' style="width:auto"> 🐦 Tweet</label></div>';
  h+='<button class="btn" id="saveLog">💾 Save Log</button></div>';
  
  const days=Object.keys(S.logs).sort().reverse();
  if(days.length){
    h+='<h3 style="font-size:13px;margin:10px 0 8px;color:#fff">📜 Past Logs</h3>';
    for(const day of days){
      const x=S.logs[day];
      h+='<div class="entry"><div class="d">'+day+'</div><h4>'+(x.commit?"✅ ":"")+(x.tweet?"🐦 ":"")+(x.did||"(empty)")+'</h4>'+(x.learned?'<p>Learned: '+x.learned+'</p>':'')+(x.blocked?'<p>Blocked: '+x.blocked+'</p>':'')+(x.next?'<p>Next: '+x.next+'</p>':'')+'</div>';
    }
  } else {
    h+='<div class="hint">No logs yet. Write your first one above.</div>';
  }
  h+='</div>';
  return h;
}

function viewStats(){
  const ov=overall(); const x=xp(); const s=streak();
  let h='<div class="view"><h3 style="font-size:14px;margin-bottom:10px">📊 Stats</h3>';
  
  if(currentUser){
    h+='<div class="signed-in-bar"><span>☁️ Synced · '+currentUser.email+'</span></div>';
  } else if(supabase){
    h+='<div class="signed-in-bar" style="background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.3);color:#fde68a"><span>⚠️ Not synced · Local only</span><button onclick="showAuth()" style="background:rgba(0,0,0,.25);border:none;color:#fff;padding:4px 10px;border-radius:6px;font-size:10px;cursor:pointer">Sign in</button></div>';
  }
  
  h+='<div class="today"><div style="display:flex;justify-content:space-between;padding:5px 0"><span>Total XP</span><b>'+x+'</b></div><div style="display:flex;justify-content:space-between;padding:5px 0"><span>Streak</span><b>'+s+' days 🔥</b></div><div style="display:flex;justify-content:space-between;padding:5px 0"><span>Layers done</span><b>'+ov.done+'/'+ov.total+'</b></div><div style="display:flex;justify-content:space-between;padding:5px 0"><span>Hours done</span><b>'+ov.hours.toFixed(0)+'/'+totalHoursAll()+'</b></div><div style="display:flex;justify-content:space-between;padding:5px 0"><span>Overall</span><b>'+ov.pct+'%</b></div></div>';
  
  h+='<h3 style="font-size:13px;margin:14px 0 8px;color:#fff">📈 Level Progress</h3>';
  for(const lv of LEVELS){
    const p=levelDone(lv); const pct=Math.round(p.done/p.total*100);
    h+='<div style="background:#1a1a2e;border-radius:8px;padding:10px;margin-bottom:6px"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:11px">Level '+lv.n+' — '+lv.name+'</span><b style="font-size:11px">'+pct+'%</b></div><div class="bar" style="background:rgba(255,255,255,.1)"><div class="fill" style="width:'+pct+'%;background:linear-gradient(90deg,'+lv.c[0]+','+lv.c[1]+')"></div></div></div>';
  }
  
  h+='<h3 style="font-size:13px;margin:14px 0 8px;color:#fff">⚙️ Data</h3>';
  h+='<button class="btn" id="export">📤 Export JSON</button>';
  h+='<button class="btn ghost" id="importBtn">📥 Import JSON</button>';
  h+='<button class="btn ghost" id="reset" style="background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:#fca5a5;margin-top:8px">🗑️ Reset all data</button>';
  h+='</div>';
  return h;
}

function attach(){
  document.querySelectorAll("[data-nav]").forEach(el=>{ el.addEventListener("click",()=>nav(el.dataset.nav)); });
  
  document.querySelectorAll("[data-tog]").forEach(el=>{
    el.addEventListener("click", async e=>{
      e.stopPropagation();
      const [id,k]=el.dataset.tog.split("|");
      const st=sub(id);
      const now=!st[k];
      st[k]=now;
      save();
      toast(now?"✓ +5 XP":(currentUser?"unsynced":"unchecked"));
      render();
      if(currentUser) syncLayerToCloud(id,k,now);
    });
  });
  
  const sl=document.getElementById("saveLog");
  if(sl) sl.addEventListener("click", async ()=>{
    const d=today();
    const data={
      did: document.getElementById("f_did").value,
      learned: document.getElementById("f_learned").value,
      blocked: document.getElementById("f_blocked").value,
      next: document.getElementById("f_next").value,
      commit: document.getElementById("f_commit").checked,
      tweet: document.getElementById("f_tweet").checked
    };
    S.logs[d]=data;
    save();
    toast(currentUser?"Log saved + synced ✓":"Log saved ✓");
    if(currentUser) await syncLogToCloud(d, data);
    render();
  });
  
  const ex=document.getElementById("export");
  if(ex) ex.addEventListener("click",()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="ai-roadmap-"+today()+".json";
    a.click(); URL.revokeObjectURL(url);
    toast("Exported ✓");
  });
  
  const imp=document.getElementById("importBtn");
  if(imp) imp.addEventListener("click",()=>{
    const input=document.createElement("input");
    input.type="file"; input.accept=".json";
    input.onchange=async e=>{
      const file=e.target.files[0];
      if(!file) return;
      try {
        const text=await file.text();
        const data=JSON.parse(text);
        if(!data.subs || !data.logs){ toast("Invalid file"); return; }
        S=data; save();
        toast("Imported ✓");
        if(currentUser) await pushLocalToCloud();
        render();
      } catch(err){ toast("Import failed: "+err.message); }
    };
    input.click();
  });
  
  const rs=document.getElementById("reset");
  if(rs) rs.addEventListener("click",()=>{
    if(confirm("Delete ALL progress? Cannot undo.")){
      if(confirm("Really sure? This cannot be undone.")){
        localStorage.removeItem(KEY);
        S=load();
        toast("Reset done");
        nav("home");
      }
    }
  });
}

checkAuth();

window.signOut = signOut;
window.showAuth = showAuth;
